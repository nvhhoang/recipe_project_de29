services:
  app:
    build: ./app
    container_name: recipe_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: recipe_db
      DB_USER: recipe_user
      DB_PASS: recipe_pass
    volumes:
      - ./logs:/var/log/recipe
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    container_name: recipe_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on: [app]
    networks: [backend, monitoring]

  mysql:
    image: mysql:8.4
    container_name: recipe_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: recipe_db
      MYSQL_USER: recipe_user
      MYSQL_PASSWORD: recipe_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: recipe_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.7.0
    container_name: recipe_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [monitoring, backend]

  grafana:
    image: grafana/grafana:12.2.0
    container_name: recipe_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    networks: [monitoring]

  loki:
    image: grafana/loki:3.5.0
    container_name: recipe_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.5.0
    container_name: recipe_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/recipe:ro
    depends_on: [loki]
    networks: [monitoring]

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  backend:
  monitoring:
